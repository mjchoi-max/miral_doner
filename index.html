<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12303A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="아동등록">
<title>아동 신규수급 등록</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="tb-row">
      <div class="tb-main">
        <div class="tb-code" id="tbCode">사업장 미선택</div>
        <div class="tb-name" id="tbName">해외결연 아동 신규수급</div>
      </div>
      <button class="ibtn" id="btnLang">EN</button>
      <button class="ibtn" id="btnSize" aria-pressed="false" aria-label="큰 글씨">A+</button>
    </div>
    <div class="warnbar hidden" id="warnbar"></div>
    <div class="offline hidden" id="offline"></div>
  </header>
  <main class="view" id="vHome"></main>
  <main class="view hidden" id="vStep">
    <div class="rail" id="rail"></div>
    <p class="stepno" id="stepNo"></p>
    <h1 id="stepTitle"></h1>
    <p class="lede" id="stepLede"></p>
    <div id="stepBody"></div>
  </main>
  <main class="view hidden" id="vExport"></main>
  <div class="bottom hidden" id="bar">
    <button class="ghost" id="btnBack">← 이전</button>
    <button class="primary" id="btnNext">다음 →</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fFace" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fFull" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fCons" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fCsv" accept=".csv,text/csv" class="hidden">
<input type="file" id="fCfg" accept=".json,application/json" class="hidden">

<script src="vendor-jszip.min.js"></script>
<script src="vendor-pico.js"></script>
<script src="vendor-qrcode.js"></script>
<script src="photocheck.js"></script>
<script src="data.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
